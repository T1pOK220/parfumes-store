
openapi: 3.0.3

info:
  title: Perfume Store API
  description: API інтернет-магазину парфумерії
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Auth
    description: Реєстрація та авторизація
  - name: User
    description: Профіль користувача
  - name: Orders
    description: Замовлення
  - name: Perfumes
    description: Каталог парфумів
  - name: Favourites
    description: Улюблені товари
  - name: Cart
    description: Кошик покупок
  - name: Health
    description: Перевірка стану API

components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        first_name:
          type: string
          example: Іван
        last_name:
          type: string
          example: Петренко
        email:
          type: string
          format: email
          example: ivan@example.com
        role:
          type: string
          example: user

    UserRegister:
      type: object
      required:
        - first_name
        - last_name
        - email
        - password
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    UserUpdate:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT-токен авторизації
        message:
          type: string
          example: Успішно увійшли в систему

    Perfume:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Sauvage
        brand:
          type: string
          example: Dior
        description:
          type: string
          example: Fresh and woody fragrance
        price:
          type: number
          format: float
          example: 3500
        volume:
          type: number
          example: 100
        gender:
          type: string
          example: men
        category:
          type: string
          example: Eau de Parfum
        image_url:
          type: string
          format: uri
          example: https://example.com/dior-sauvage.jpg
        stock:
          type: integer
          minimum: 0
          example: 10
        created_at:
          type: string
          format: date-time
          example: "2026-09-28T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-09-28T10:00:00Z"

    CreatePerfumeRequest:
      type: object
      required:
        - name
        - brand
        - price
        - volume
        - gender
        - category
        - stock
      properties:
        name:
          type: string
          example: Sauvage
        brand:
          type: string
          example: Dior
        description:
          type: string
          example: Fresh and woody fragrance
        price:
          type: number
          format: float
          example: 3500
        volume:
          type: number
          example: 100
        gender:
          type: string
          example: men
        category:
          type: string
          example: Eau de Parfum
        image_url:
          type: string
          format: uri
          example: https://example.com/dior-sauvage.jpg
        stock:
          type: integer
          minimum: 0
          example: 10

    UpdatePerfumeRequest:
      type: object
      properties:
        name:
          type: string
          example: Sauvage Elixir
        brand:
          type: string
          example: Dior
        description:
          type: string
          example: Intense woody fragrance
        price:
          type: number
          format: float
          example: 4200
        volume:
          type: number
          example: 100
        gender:
          type: string
          example: men
        category:
          type: string
          example: Eau de Parfum
        image_url:
          type: string
          format: uri
        stock:
          type: integer
          minimum: 0
          example: 8

    PerfumeResponse:
      $ref: '#/components/schemas/Perfume'

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 5
        status:
          type: string
          example: створено
        sum:
          type: number
          format: float
          example: 3500

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        parfume_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
        price:
          type: number
          format: float
          description: Ціна за одиницю на момент замовлення

    OrderWithItems:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'

    FavouriteItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        parfume_id:
          type: integer
        quantity:
          type: integer
          example: 1

    CartItem:
      type: object
      properties:
        id:
          type: integer
        cart_id:
          type: integer
        parfume_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
        parfume:
          $ref: '#/components/schemas/Perfume'

    Cart:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'

    AddCartItemRequest:
      type: object
      required:
        - parfume_id
        - quantity
      properties:
        parfume_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          default: 1

    UpdateCartItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: ValidationError
        code:
          type: string
          example: NAME_REQUIRED
        message:
          type: string
          example: Некоректні дані запиту
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: name
              message:
                type: string
                example: Name is required
        request_id:
          type: string

  responses:
    BadRequest:
      description: Некоректні дані запиту
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Необхідна авторизація
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Ресурс не знайдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security:
  - bearer_auth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Перевірити стан API
      security: []
      responses:
        '200':
          description: API працює
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/register:
    post:
      tags:
        - Auth
      summary: Зареєструвати користувача
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: Успішно зареєстровано
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: Успішно зареєстровано
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Користувач із таким email уже існує

  /auth/login:
    get:
      tags:
        - Auth
      summary: Увійти в систему
      description: GET збережено відповідно до наданого маршруту. Рекомендовано використовувати POST для передавання пароля.
      security: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: password
          in: query
          required: true
          schema:
            type: string
            format: password
      responses:
        '200':
          description: Успішна авторизація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Неправильний email або пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/me:
    get:
      tags:
        - User
      summary: Отримати профіль користувача
      responses:
        '200':
          description: Профіль отримано
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - User
      summary: Оновити профіль користувача
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Дані успішно оновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_user:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: Дані успішно оновлено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /order/:
    get:
      tags:
        - Orders
      summary: Отримати замовлення користувача
      responses:
        '200':
          description: Список замовлень
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Orders
      summary: Створити замовлення
      description: Замовлення створюється для поточного користувача. Тіло запиту не потрібне, якщо сервер бере товари з кошика.
      responses:
        '201':
          description: Замовлення успішно створено
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  message:
                    type: string
                    example: Замовлення успішно створено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /perfumes:
    get:
      tags:
        - Perfumes
      summary: Отримати каталог парфумів
      security: []
      responses:
        '200':
          description: Список парфумів
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerfumeResponse'

    post:
      tags:
        - Perfumes
      summary: Створити парфум
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePerfumeRequest'
      responses:
        '201':
          description: Парфум створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfumeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /perfumes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID парфуму
        schema:
          type: integer
          minimum: 1

    get:
      tags:
        - Perfumes
      summary: Отримати парфум за ID
      security: []
      responses:
        '200':
          description: Парфум знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfumeResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Perfumes
      summary: Оновити парфум
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePerfumeRequest'
      responses:
        '200':
          description: Парфум оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfumeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Perfumes
      summary: Частково оновити парфум
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePerfumeRequest'
      responses:
        '200':
          description: Парфум оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfumeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Perfumes
      summary: Видалити парфум
      responses:
        '204':
          description: Парфум успішно видалено
        '404':
          $ref: '#/components/responses/NotFound'

  # Legacy routes: залишені для сумісності з наявним кодом.
  /parfumes:
    get:
      tags:
        - Perfumes
      summary: Отримати каталог парфумів (legacy route)
      security: []
      responses:
        '200':
          description: Каталог парфумів
          content:
            application/json:
              schema:
                type: object
                properties:
                  parfumes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Perfume'

    post:
      tags:
        - Perfumes
      summary: Створити парфум (legacy route)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePerfumeRequest'
      responses:
        '201':
          description: Парфум успішно створено
          content:
            application/json:
              schema:
                type: object
                properties:
                  parfume:
                    $ref: '#/components/schemas/Perfume'
                  message:
                    type: string
                    example: Парфум успішно створено
        '400':
          $ref: '#/components/responses/BadRequest'

  /parfumes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID парфуму
        schema:
          type: integer
          minimum: 1

    get:
      tags:
        - Perfumes
      summary: Отримати парфум за ID (legacy route)
      security: []
      responses:
        '200':
          description: Парфум знайдено
          content:
            application/json:
              schema:
                type: object
                properties:
                  parfume:
                    $ref: '#/components/schemas/Perfume'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Perfumes
      summary: Оновити парфум (legacy route)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePerfumeRequest'
      responses:
        '200':
          description: Парфум оновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  parfume:
                    $ref: '#/components/schemas/Perfume'
                  message:
                    type: string
                    example: Парфум успішно оновлено
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Perfumes
      summary: Видалити парфум (legacy route)
      responses:
        '200':
          description: Парфум видалено
          content:
            application/json:
              schema:
                type: object
                properties:
                  parfume:
                    $ref: '#/components/schemas/Perfume'
                  message:
                    type: string
                    example: Парфум успішно видалено
        '404':
          $ref: '#/components/responses/NotFound'

  /favourites:
    get:
      tags:
        - Favourites
      summary: Отримати улюблені товари
      responses:
        '200':
          description: Улюблені товари отримано
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FavouriteItem'
                  message:
                    type: string
                    example: Отримано успішно
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favorites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID парфуму
        schema:
          type: integer
          minimum: 1

    post:
      tags:
        - Favourites
      summary: Додати парфум до улюблених
      responses:
        '200':
          description: Додано в улюблені
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/FavouriteItem'
                  message:
                    type: string
                    example: Додано в улюблені
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favourites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID запису улюбленого товару
        schema:
          type: integer
          minimum: 1

    delete:
      tags:
        - Favourites
      summary: Видалити товар з улюблених
      responses:
        '200':
          description: Видалено успішно
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/FavouriteItem'
                  message:
                    type: string
                    example: Видалено успішно
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /cart:
    get:
      tags:
        - Cart
      summary: Отримати кошик
      responses:
        '200':
          description: Кошик отримано
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart_items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CartItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Cart
      summary: Очистити кошик
      responses:
        '200':
          description: Кошик очищено
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart_items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CartItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cart/item:
    post:
      tags:
        - Cart
      summary: Додати парфум до кошика
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Товар додано до кошика
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/CartItem'
                  message:
                    type: string
                    example: Успішно додано в кошик
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cart/item/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID товару в кошику
        schema:
          type: integer
          minimum: 1

    patch:
      tags:
        - Cart
      summary: Оновити кількість товару в кошику
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Кількість оновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/CartItem'
                  message:
                    type: string
                    example: Кількість оновлена успішно
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Cart
      summary: Видалити товар із кошика
      responses:
        '200':
          description: Товар видалено
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/CartItem'
                  message:
                    type: string
                    example: Видалено успішно
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'