services:
  web:
    build: ./frontend
    image: parfumes-web:1.0.0
    container_name: web
    ports:
      - "5173:80"
    depends_on:
      - api

  api:
    build: ./backend
    image: parfumes-api-node:1.0.0
    container_name: api
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
